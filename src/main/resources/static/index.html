<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DevOps Java Web</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            background: #f3f6fb;
            color: #172033;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
        }

        main {
            max-width: 38rem;
            margin: 1.5rem;
            padding: 2.5rem;
            border-radius: 1rem;
            background: white;
            box-shadow: 0 1rem 3rem #17203318;
        }

        h1 {
            margin-top: 0;
        }

        code {
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            background: #eef2f8;
        }
    </style>
</head>
<body>
<main>
    <h1>DevOps Java Web</h1>
    <p>Your Java web application is running.</p>
    <p>Check application status at <code>/api/health</code>.</p>
</main>
</body>
</html>
